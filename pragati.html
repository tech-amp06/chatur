function vLogin(){const o=Object.entries(S.st).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
 $('#m').innerHTML=`<div class="card login"><h2>🎯 PRAGATI</h2><p class="mu">${t('tag')}</p><select id="lr" style="width:100%" onchange="vLogin2()"><option value="student">${t('student')}</option><option value="parent">${t('parent')}</option><option value="teacher">${t('teacher')}</option></select><div id="who"><select id="ls" style="width:100%;margin-top:6px">${o}</select></div><input id="lp" type="password" inputmode="numeric" placeholder="${t('pin')}"><button class="pri" style="width:100%" onclick="doLogin()">${t('enter')}</button><p id="le" style="color:var(--rd)"></p><p class="mu">${t('demo')}</p></div>`}
function vLogin2(){$('#who').style.display=$('#lr').value=='teacher'?'none':'block'}
function doLogin(){const r=$('#lr').value,id=$('#ls').value,p=$('#lp').value;const ok=r=='teacher'?p=='7777':r=='parent'?p=='9999':S.st[id].pin==p;
 if(!ok)return $('#le').textContent=t('bad');S.auth={role:r,sid:r=='teacher'?null:id,view:ROLES[r][0]};S.res=null;S.ses=null;save();render()}
function logout(){S.auth=null;S.ses=null;save();render()}
// ===== UI =====
const $=s=>document.querySelector(s),pc=x=>Math.round(x*100)+'%';
function nav(){const a=S.auth;$('#nav').innerHTML=a?ROLES[a.role].map(k=>`<button class="${a.view==k?'on':''}" onclick="S.auth.view='${k}';render()">${t(k=='impact'?'imp':k)}</button>`).join('')+(a.role=='teacher'?`<button onclick="if(confirm('?')){localStorage.removeItem(K);seed();render()}">${t('reset')}</button>`:'')+`<button onclick="logout()">${t('logout')}</button>`:''}
function cell(p){if(p==null)return'<td class="mu">–</td>';const c=p>.7?'#0f9b8e':p>.45?'#e8a33d':'#d2504b';return`<td style="background:${c}33;font-weight:600">${pc(p)}</td>`}
function render(){nav();const a=S.auth;if(!a)return vLogin();if(!ROLES[a.role].includes(a.view))a.view=ROLES[a.role][0];({student:vStudent,teacher:vTeacher,parent:vParent,impact:vImpact})[a.view]()}
function vStudent(){const s=S.st[S.auth.sid],z=S.ses;let h='';
 const bd=[s.bd.includes('b1')&&'b1',s.sk>=3&&'b3',s.bd.includes('b2')&&'b2',s.bd.includes('b4')&&'b4'].filter(Boolean);
 if(z){const b=z.blocks[z.bi],q=b.qq[z.qi],n=z.blocks.reduce((a,x,i)=>a+(i<z.bi?x.qq.length:0),0)+z.qi;
  h=`<div class="card hero"><span class="chip">⭐ ${s.xp} XP</span><span class="chip">🔥 ${s.sk} ${t('streak')}</span><div class="bar" style="margin-top:8px"><i style="width:${pc(z.qi/b.qq.length)};background:#fff"></i></div></div><div class="card pop" key="${z.bi}${z.qi}"><span class="tag">${z.bi?t('chk'):t('wk')} · ${t('qn',z.qi+1,b.qq.length)}</span><h2 style="margin-top:8px">${q[1]}</h2>${q[2].map((o,i)=>`<button class="opt ${z.fb==null?'':i==q[3]?'good':i==z.fb?'bad':''}" ${z.fb==null?`onclick="ans(${i})"`:'disabled'}>${o}</button>`).join('')}${z.fb==null?'':`<div class="pop" style="margin:8px 0"><b>${z.fb==q[3]?t('ok'):t('no',q[2][q[3]])}</b></div><button class="te" onclick="nxt()">${t('nx')} →</button>`}<p class="mu">${t('priv')}</p></div>`}
 else{h=`<div class="card hero"><h2>${t('hi',s.n)}</h2><span class="chip">⭐ ${s.xp} XP</span><span class="chip">🔥 ${s.sk} ${t('streak')}</span>${bd.map(b=>`<span class="chip">🏅 ${t(b)}</span>`).join('')}</div>${S.res?`<div class="card pop"><h2>${t('res')}</h2>${S.res}</div>`:''}<h2>${t('quests')}</h2>`+s.tr.map(x=>{const ch=chain(x).reverse(),w=s.lv[x]||x;
  return`<div class="card"><h3>${t('s_'+cn(x).s)}: ${nm(x)} ${w!=x?`<span class="tag" style="background:var(--te);color:#fff">🧭 ${t('fp')}</span>`:''}</h3><div class="row" style="margin:10px 0">${ch.map((c,i)=>`${i?'<span>➜</span>':''}<div class="card node" style="border:2px solid ${c==w?'var(--te)':'var(--bd)'}"><div class="mu">${t('cls',cn(c).g)}</div>${nm(c)}<div class="bar"><i style="width:${pc(s.m[c]??0)}"></i></div>${c==w?`<b style="color:var(--te)">📍 ${t('here')}</b>`:''}</div>`).join('')}</div><div class="row"><button class="pri" onclick="start('${x}')">🚀 ${t('go')}</button><button onclick="sim('${x}')">⚡ ${t('sim')}</button></div></div>`}).join('')}
 $('#m').innerHTML=h}
function start(x){const s=S.st[S.auth.sid],w=s.lv[x]||x;S.ses={t:x,blocks:[{cid:w,qq:qs(w),a:[]}],bi:0,qi:0,fb:null};render()}
function ans(i){S.ses.fb=i;S.ses.blocks[S.ses.bi].a.push(i);render()}
function nxt(){const z=S.ses,b=z.blocks[z.bi];z.fb=null;if(++z.qi<b.qq.length)return render();
 const s=S.st[S.auth.sid],g=grade(s,b.cid,b.a,b.qq);Object.assign(b,g);z.qi=0;
 const pr=z.bi==0?g.sc<.67&&g.errs.some(e=>e=='prereq'||e=='misconception'):g.sc<.67,c=cn(b.cid);
 if(pr&&c.pre.length){const n=cn(c.pre[0]);z.blocks.push({cid:n.id,qq:qs(n.id),a:[]});z.bi++;return render()}
 const r=finish(S.auth.sid,z.t,z.blocks);s.sk=Math.max(s.sk,1);['b1'].concat(z.blocks.length>1?['b2']:[]).concat(r.p&&r.p.type=='up'?['b4']:[]).forEach(k=>{if(!s.bd.includes(k))s.bd.push(k)});
 S.res=`<p>${t('sc',pc(z.blocks[0].sc),z.blocks.length)}</p><p>${r.p?t('sent'):r.low?t('more'):t('keep')}</p>`;S.ses=null;save();render()}
function sim(x){const s=S.st[S.auth.sid];auto(S.auth.sid,x);s.bd.includes('b1')||s.bd.push('b1');S.res=`<p>${t('simd',s.h[s.lv[x]||x].map(pc).join(', '))}</p>`;save();render()}
function aud(d,p){S.aud.unshift({ts:new Date().toLocaleString(),d,sid:p.sid,f:p.t,to:p.to})}
function decide(id,d){const p=S.props.find(x=>x.id==id);p.status=d;if(d=='approved')S.st[p.sid].lv[p.t]=p.to;aud(d,p);save();render()}
function decideGroup(to,d){S.props.filter(p=>p.status=='pending'&&p.to==to).forEach(p=>decide(p.id,d))}
const er=a=>a.map(e=>t('e_'+e)).join(', ')||'–';
function vTeacher(){const pend=S.props.filter(x=>x.status=='pending'),grp={};pend.forEach(p=>(grp[p.to]=grp[p.to]||[]).push(p));
 let h=`<div class="card"><h2>${t('heat')}</h2><div class="ov"><table><tr><th></th>${C.map(c=>`<th>${nm(c.id).slice(0,14)}<br><span class="mu">${t('cls',c.g)}</span></th>`).join('')}</tr>${Object.values(S.st).map(s=>`<tr><td>${s.n}</td>${C.map(c=>cell(s.m[c.id])).join('')}</tr>`).join('')}</table></div></div>`;
 h+=`<div class="card"><h2>${t('rq',pend.length)}</h2>${pend.length?'':`<p class="mu">${t('none')}</p>`}`+pend.map(p=>`<div class="card"><b>${S.st[p.sid].n}</b> · ${nm(p.t)} <span class="tag">${t('ty_'+p.type)}</span><p>${t(p.nk,nm(p.to),cn(p.to).g)}</p><div class="mu">${t('ev',p.ev.at,nm(p.ev.c),pc(p.ev.score),er(p.ev.errs),p.ev.pr.map(x=>nm(x[0])+' '+pc(x[1])).join('; ')||'–')}</div><div class="row" style="margin-top:6px">${['approved','rejected','postponed'].map((d,i)=>`<button class="${i?'':'te'}" onclick="decide(${p.id},'${d}')">${t(d)}</button>`).join('')}</div></div>`).join('')+'</div>';
 h+=`<div class="card"><h2>${t('grp')}</h2>${Object.keys(grp).length?'':`<p class="mu">${t('nogrp')}</p>`}`+Object.entries(grp).map(([to,a])=>`<p><b>${nm(to)}</b> (${t('cls',cn(to).g)}): ${a.map(p=>S.st[p.sid].n).join(', ')}</p><div class="row"><button class="te" onclick="decideGroup('${to}','approved')">${t('gap')}</button><button onclick="ws('${to}')">${t('wsb')}</button></div>`).join('')+'<div id="ws"></div></div>';
 h+=`<div class="card"><h2>${t('cont')}</h2>${S.draft.length?'':`<p class="mu">${t('nod')}</p>`}`+S.draft.map((q,i)=>`<p>${nm(q[0])}: ${q[1]} <span class="tag">${t('draft')}</span> <button onclick="S.q.push(S.draft.splice(${i},1)[0]);S.aud.unshift({ts:new Date().toLocaleString(),d:'approved',sid:'B',f:'${q[0]}',to:'${q[0]}'});save();render()">${t('approved')}</button> <button onclick="S.draft.splice(${i},1);save();render()">${t('rejected')}</button></p>`).join('')+'</div>';
 h+=`<div class="card"><h2>${t('audit')}</h2>${S.aud.map(a=>`<div class="mu">${t('aud',a.ts,S.st[a.sid].n,t(a.d),nm(a.f),nm(a.to))}</div>`).join('')}</div>`;$('#m').innerHTML=h}
function ws(c){$('#ws').innerHTML=`<div class="card"><h3>${t('wsb')}: ${nm(c)}</h3><ol>${qs(c).map(q=>`<li>${q[1]} ${q[2].map((o,i)=>`(${'abcd'[i]}) ${o}`).join('  ')}</li>`).join('')}</ol><button class="np" onclick="window.print()">${t('prt')}</button></div>`}
function vParent(){const s=S.st[S.auth.sid];
 $('#m').innerHTML=`<div class="card"><h2>${s.n} · ${t('ptitle')}</h2>${s.tr.map(x=>{const y=s.lv[x]||x;return`<p><b>${t('s_'+cn(x).s)}: ${nm(x)}</b> – ${y==x?'✅ '+t('pok'):'🧭 '+t('pneed')+': <b>'+nm(y)+'</b>'}</p>`}).join('')}<h3>${t('pwk')}</h3><p>${t('ptip')}</p><h3>${t('pm')}</h3>${Object.entries(s.m).map(([c,p])=>`<div>${nm(c)}<div class="bar"><i style="width:${pc(p)}"></i></div></div>`).join('')}</div>`}
function vImpact(){const ss=Object.values(S.st),all=S.props,pend=all.filter(x=>x.status=='pending'),gr=new Set(pend.map(p=>p.to)).size;
 const tool=gr*.5+ss.length*.25,man=ss.length*4,wk=(40*.25+Math.max(gr,1)*.5).toFixed(1),cov=C.map(c=>({c,n:qs(c.id).length})),ok=cov.filter(x=>x.n>=3).length;
 const big=(v,l)=>`<div><div class="big">${v}</div><span class="mu">${l}</span></div>`;
 $('#m').innerHTML=`<div class="card"><h2>${t('timeh')}</h2><div class="grid">${big(tool.toFixed(1)+' '+t('min'),t('t1'))}${big(man+' '+t('min'),t('t2'))}${big(wk+' '+t('min'),t('t3'))}</div><p class="mu">${t('t4')}</p></div>
 <div class="card"><h2>${t('pil')}</h2><div class="grid">${big(ss.length,t('stu'))}${big(all.length,t('prp'))}${big(all.filter(x=>x.status=='approved').length,t('apc'))}</div><ul><li>${t('pl1')}</li><li>${t('pl2')}</li><li>${t('pl3')}</li></ul></div>
 <div class="card"><h2>${t('covh')}</h2><p>${t('covn',C.length,ok)}</p><div class="ov"><table><tr>${[0,1,2,3,4].map(i=>`<th>${t('c'+i)}</th>`).join('')}</tr>${cov.map(x=>`<tr><td>${nm(x.c.id)}</td><td>${t('s_'+x.c.s)}</td><td>${x.c.g}</td><td>${x.n}</td><td>${t(x.n>=3?'st1':x.n?'st2':'st3')}</td></tr>`).join('')}</table></div></div><div class="card"><p>${t('scal')}</p><p class="mu">${t('lim')}</p></div>`}
$('#lang').onchange=e=>{LI=LK[e.target.value];render()};
load();render();
</script>
</script></body></html>
